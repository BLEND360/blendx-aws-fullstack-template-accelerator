# Reusable pull-request checks and a read-only infrastructure diff.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/api/uv.lock
      - run: uv sync --frozen
      - name: Layering contracts
        run: uv run lint-imports
      - run: uv run pytest -q
      - name: Image builds
        working-directory: .
        run: docker build -t api:ci .

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: infra/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Suite with the brand replaced by a neutral theme
        run: npm run test:neutral
      - name: Brand and API base URL boundaries
        run: npm run check:boundaries
      - run: npm run build

  diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: infra/uv.lock
      - run: uv sync --frozen
        working-directory: infra
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cdk-diff-${{ github.run_id }}
      - name: Read-only CDK template diff
        run: uv run --project infra python scripts/diff.py --env dev
