[project]
name = "infra"
version = "0.1.0"
description = "CDK app: every stack in the template"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
    # scripts/bootstrap.py only: OIDC provider lookup and caller-account check.
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
