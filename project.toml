# Single parameter source. Every resource name in every layer is derived from
# this file by infra/config.py. Edit it, then run `python scripts/setup.py`.

[project]
name        = "my-app"          # lowercase letters, digits, hyphens; 3-24 chars
aws_account = "123456789012"
aws_region  = "us-east-1"
github_org  = "BLEND360"
github_repo = "my-app"          # repository the deploy role trusts (GitHub OIDC)

# Local test values (uncomment these and comment the block above to test against AWS):
# name        = "juan-test"
# aws_account = "175562788224"
# github_repo = "blendx-aws-fullstack-template-accelerator"

[auth]
# Extra sign-in / sign-out return addresses besides http://localhost:5173/ (always allowed).
# Add the deployed app's public URL, with a trailing slash, once it exists.
# callback_urls = ["https://app.example.com/"]

[harness]
# Leave empty to deploy and use the template's starter harness.
# Set to an existing harness ARN to consume that one instead; the starter
# harness is then not deployed.
arn       = ""
endpoint  = "PROD"   # which alias of that harness to invoke
model_id  = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"    # starter harness
model_ids = ["us.anthropic.claude-sonnet-4-5-20250929-v1:0"]  # backend allowlist

# Per environment: tasks, Fargate cpu/memory, and NAT gateways (1 or 2: one per zone).
[environments.dev]
desired_count = 1
cpu           = 256
memory        = 512
nat_gateways  = 1

[environments.prod]
desired_count = 2
cpu           = 512
memory        = 1024
nat_gateways  = 2
