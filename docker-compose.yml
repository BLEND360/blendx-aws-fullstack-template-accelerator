# Local run of the whole app: `docker compose up --build`, then http://localhost:5173.
# Needs backend/api/.env (python scripts/setup.py), and the root .env that setup.py writes (HOST_UID/HOST_GID).
services:
  api:
    # The same image ECS runs.
    build: .
    # Local only: run as your host user so the container can read and refresh ~/.aws
    # (`aws login`/SSO caches are 600-mode files you own). The image's own user (uid 10001) cannot.
    # HOST_UID/HOST_GID come from the root .env that scripts/setup.py writes. Without it (Windows) the
    # default is the image's own user, which is what Docker Desktop's mounts are readable by.
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    ports:
      - "8000:8000"
      # The web container shares this container's network (see `web`), so its
      # dev server is published here.
      - "5173:5173"
    env_file: backend/api/.env
    environment:
      - AWS_PROFILE  # passed through only when set on the host
      # /home/app is mode 700 and owned by uid 10001: give the host user a home it can enter.
      - HOME=/tmp/aws-home
    volumes:
      # Local AWS credentials for /ready and harness calls. Writable: `aws login`/SSO refresh their cache.
      - ~/.aws:/tmp/aws-home/.aws

  # Vite dev server. It shares the api container's network so the dev proxy's
  # http://localhost:8000 reaches the API: no API URL to configure anywhere.
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    network_mode: "service:api"
    depends_on:
      - api
    environment:
      # Bind mounts from Windows/macOS do not deliver file events; poll instead.
      - CHOKIDAR_USEPOLLING=true
      # A flaky network (VPN, IPv6) made `npm ci` fail once with ENETUNREACH; retry instead of dying.
      - NPM_CONFIG_FETCH_RETRIES=5
      - NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=2000
    volumes:
      - ./frontend/web:/app
      # Keeps the host's node_modules (wrong OS binaries) out of the container.
      - /app/node_modules
