# Pull-request checks. ST-09 extends this with cdk diff and the deploy
# pipeline; each job here only needs the code, never AWS credentials.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Layering contracts
        run: uv run lint-imports
      - run: uv run pytest -q
      - name: Image builds
        working-directory: .
        run: docker build -t api:ci .

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Suite with the brand replaced by a neutral theme
        run: npm run test:neutral
      - name: Brand and API base URL boundaries
        run: npm run check:boundaries
      - run: npm run build
